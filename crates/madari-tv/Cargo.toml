[package]
name = "madari-tv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The spec generator only makes sense with the schemas compiled in; declaring it
# keeps a plain `cargo test -p madari-tv` from trying to build it.
[[example]]
name = "web_openapi"
required-features = ["openapi"]

[features]
# OpenAPI generation is only needed to produce web/openapi.json for client codegen.
# Keep utoipa (and the shared DTO schemas) out of the shipped Android build.
openapi = ["dep:utoipa", "madari-core/openapi", "madari-model/openapi"]

[dependencies]
madari-core.workspace = true
madari-model.workspace = true
madari-native.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
jni = "0.21.1"
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
axum.workspace = true
subtle.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni-platform = { package = "jni", version = "0.22.4" }
