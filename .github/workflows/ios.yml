name: iOS

# The Swift app is built with xtool against a Darwin Swift SDK, which only exists on
# the development machine (see docs/ios.md), so this job deliberately checks what is
# verifiable without that SDK: the Rust boundary compiles and the committed Swift
# bindings still match the Rust definitions they were generated from.
#
# A stale binding set is the failure that would otherwise only surface as a confusing
# Swift compile error on a developer's machine, so it is gated here.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The committed crates/madari-tv/web/dist is what gets embedded; the web UI has
  # its own workflow that regenerates and diffs it.
  MADARI_SKIP_WEB_BUILD: "1"
  MADARI_IOS_SKIP_TARGET: "1"

jobs:
  boundary:
    name: Rust boundary and bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      # web/dist is a pnpm build output and deliberately not committed, so the previous
      # assertion that it was present only ever failed here. build.rs writes a placeholder
      # when it is absent, which is all this job needs: it checks the Rust boundary, and
      # web.yml owns the real bundle.
      - name: Note the placeholder bundle
        run: |
          if [ -f crates/madari-tv/web/dist/index.html ]; then
            echo "Using the existing web/dist."
          else
            echo "web/dist is absent; build.rs will substitute its placeholder for this check."
          fi

      # Compiles madari-tv, madari-native and the UniFFI boundary for the host and
      # runs the profile/media round-trip tests that cross it.
      - name: Test the iOS boundary
        run: cargo test --locked -p madari-ios

      - name: Check the shared crates
        run: cargo check --locked -p madari-tv

      # Regenerates the Swift bindings from a host build and fails on any difference.
      # No Darwin SDK is needed: `uniffi-bindgen --library` reads a Linux cdylib.
      - name: Assert the committed bindings are current
        env:
          MADARI_IOS_BINDINGS_CHECK: "1"
        run: ./scripts/build-ios-native.sh
