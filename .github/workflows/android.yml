name: Android TV

# Also called by release.yml to build the APK for a tag. Pushes to main are not
# a trigger: pull_request covers the check, and the release build covers the tag,
# so a push would only repeat nine minutes of work.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Defaults to the ref that triggered the run.
        type: string
        required: false
    # Declared here, not only on the job: a workflow invoked with `uses:` exposes
    # outputs through workflow_call, so a job-level output alone would leave
    # `needs.<job>.outputs.version` empty for the caller.
    outputs:
      version:
        description: versionName read back out of the built APK
        value: ${{ jobs.apk.outputs.version }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the NDK the build script expects.
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    name: performance APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Before setup-node, so its `cache: pnpm` can find the pnpm store.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/madari-tv/web/package.json

      # The native build embeds the web UI, so it needs Node and a real install.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crates/madari-tv/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/madari-tv/web

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 ndk;${{ env.NDK_VERSION }}"
          accept-android-sdk-licenses: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4

      # Builds both ABIs into apps/tv/app/src/main/jniLibs and stages the
      # rustls-platform-verifier AAR that the JNI TLS layer needs.
      # ANDROID_HOME is exported by setup-android into the step environment, so
      # it is expanded by the shell here rather than by the ${{ env }} context.
      - name: Native libraries and web UI
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          ./scripts/build-tv-native.sh

      # -x buildNative: the previous step already ran it, and Gradle re-running
      # it would rebuild the same libraries with less useful logs.
      - name: Assemble
        run: ./gradlew :app:assemblePerformance -x buildNative
        working-directory: apps/tv

      - name: Assert both ABIs are packaged
        working-directory: apps/tv
        run: |
          apk=app/build/outputs/apk/performance/app-performance.apk
          test -f "$apk" || { echo "::error::$apk was not produced"; exit 1; }
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$apk" "lib/$abi/libmadari_tv.so" | grep -q "libmadari_tv.so" \
              || { echo "::error::$abi is missing from the APK"; exit 1; }
          done

      # The version the release PR wrote into build.gradle.kts, read back from
      # the APK so a release cannot ship a stale or mismatched version.
      - name: Report the packaged version
        id: version
        working-directory: apps/tv
        run: |
          apk=app/build/outputs/apk/performance/app-performance.apk
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -1)
          badging=$("$aapt" dump badging "$apk")
          name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "versionName=$name versionCode=$code"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: madari-tv-performance-apk
          path: apps/tv/app/build/outputs/apk/performance/app-performance.apk
          retention-days: 14

    outputs:
      version: ${{ steps.version.outputs.name }}
