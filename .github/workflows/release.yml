name: Release

# Release Please keeps an open release PR on main. Merging that PR is what cuts
# the release: it writes the version into CHANGELOG.md and
# apps/tv/app/build.gradle.kts, tags the merge commit, and publishes the GitHub
# Release. This same run then builds the APK for that tag and attaches it.
#
# The build deliberately lives in this workflow rather than in a separate
# `on: release` one: a release created with the default GITHUB_TOKEN does not
# trigger further workflows, so a separate listener would never fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    name: release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The organisation blocks GitHub Actions from creating pull requests
      # (Settings → Actions → General → Workflow permissions), so the run's own
      # GITHUB_TOKEN is refused with "GitHub Actions is not permitted to create or
      # approve pull requests". A fine-grained PAT scoped to this repository
      # bypasses that, because the pull request is then authored by a person.
      #
      # Create one at https://github.com/settings/personal-access-tokens/new with
      # repository access limited to this repo and these permissions:
      #   Contents: Read and write, Pull requests: Read and write
      # then save it as the RELEASE_PLEASE_TOKEN repository secret. Without the
      # secret this falls back to GITHUB_TOKEN, which only works if the
      # organisation setting is turned on instead.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: APK for the tag
    needs: propose
    if: needs.propose.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.propose.outputs.tag }}

  linux:
    name: Linux packages for the tag
    needs: propose
    if: needs.propose.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package-linux.yml
    with:
      ref: ${{ needs.propose.outputs.tag }}

  attach:
    name: attach the artifacts
    needs: [propose, build, linux]
    if: needs.propose.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: madari-tv-performance-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: madari-linux-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: madari-linux-arm64
          path: dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.propose.outputs.tag }}
          APK_VERSION: ${{ needs.build.outputs.version }}
          LINUX_VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$APK_VERSION" ]; then
            echo "::error::the APK did not report a version"
            exit 1
          fi
          if [ "$TAG" != "v$APK_VERSION" ]; then
            echo "::error::tag $TAG does not match the APK version $APK_VERSION"
            exit 1
          fi
          # The Linux packages carry the same Cargo version, so a mismatch means
          # the tag was cut from a tree that disagrees with itself.
          if [ "$LINUX_VERSION" != "$APK_VERSION" ]; then
            echo "::error::linux packages are $LINUX_VERSION but the APK is $APK_VERSION"
            exit 1
          fi
          mv dist/app-performance.apk "dist/madari-tv-${APK_VERSION}-performance.apk"
          echo "--- attaching ---"
          ls -la dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
