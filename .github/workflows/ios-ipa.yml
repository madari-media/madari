name: iOS IPA

# Builds an unsigned .ipa for sideloading (xtool install, Sideloadly, AltStore).
#
# Deliberately unsigned: signing would need Apple credentials in this repository's
# secrets, and an unsigned ipa keeps the artifact useful to anyone. The cost is that
# the installer has to re-sign it, which is what those tools do anyway.
#
# `workflow_call` exists so the release flow can run this as one of its jobs. A tag
# is not enough on its own: release-please pushes its tag with GITHUB_TOKEN, and a
# release created that way does not trigger further workflows. That is the same
# reason the APK is built inside release.yml rather than by a listener on `release`.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the ipa to.
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the ipa to, e.g. v0.2.0. Leave empty to only upload a workflow artifact.
        type: string
        required: false

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

# Writing is needed for the attach step below, which only runs on a dispatch that
# passes a tag. The release flow calls this without one and attaches the artifact
# itself, but a called workflow cannot be granted more than its caller, so the
# permission has to be declared here.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The settings UI is embedded with include_str!, and this job only needs the crate to
  # compile, so build.rs's placeholder is what gets embedded here. web.yml owns the real
  # bundle.
  MADARI_SKIP_WEB_BUILD: "1"
  # The released macOS binary, not a source checkout. xtool's own package declares
  # swift-tools-version 6.2, so building it from source tied this job to a toolchain
  # newer than the runner's default and cost several minutes on every run.
  # Building xtool from source is the fallback when the released binary will not run.
  XTOOL_REF: 0f42dafce6d7bdcfbe2da9ad05c4dc8591d7dba9
  XTOOL_VERSION: 1.19.0

jobs:
  ipa:
    name: Unsigned ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # A runner whose Xcode licence has not been accepted waits on the first
      # xcodebuild call instead of failing, which is a long time to wait for nothing.
      - name: Accept the Xcode licence
        run: sudo xcodebuild -license accept || true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-ipa

      # The settings UI is embedded into madari-tv with include_str!, and build.rs writes
      # a placeholder when web/dist is absent so a fresh clone still compiles. A
      # placeholder is fine for a test build and wrong in something a user installs, so
      # the real bundle is built here.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/madari-tv/web/package.json

      # After action-setup, so its `cache: pnpm` can find the pnpm store.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crates/madari-tv/web/pnpm-lock.yaml

      - name: Build the embedded web bundle
        working-directory: crates/madari-tv/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          # The server embeds these three by fixed path, and build.rs drops a placeholder
          # that announces itself, so check for both here.
          for asset in index.html app.js style.css; do
            test -f "dist/$asset" || { echo "::error::dist/$asset is missing"; exit 1; }
          done
          if grep -q "were not built" dist/app.js; then
            echo "::error::the web bundle is the build.rs placeholder, not a real build"
            exit 1
          fi

      # ~500MB of XCFrameworks. Cached, but the key includes the script's pinned
      # checksum so a version bump always refetches.
      - name: Cache libmpv XCFrameworks
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: apps/ios/native/mpv
          key: ios-mpv-${{ hashFiles('scripts/fetch-ios-mpv.sh') }}

      - name: Fetch libmpv
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-ios-mpv.sh

      - name: Install xtool
        run: |
          # The release tag has no leading v, while gh prints one in its listing, so try
          # both spellings rather than encoding that detail here and failing with a 404.
          for tag in "${XTOOL_VERSION}" "v${XTOOL_VERSION}"; do
            if curl -fsSL -o xtool.zip \
              "https://github.com/xtool-org/xtool/releases/download/${tag}/xtool.app.zip"; then
              echo "Downloaded xtool ${tag}"
              break
            fi
          done
          test -f xtool.zip \
            || { echo "::error::could not download xtool ${XTOOL_VERSION}"; exit 1; }
          unzip -q xtool.zip
          BIN=$(find . -type f -path '*MacOS/xtool' | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::no xtool executable in the release archive"
            find . -maxdepth 4 | head -30
            exit 1
          fi
          chmod +x "$BIN"
          echo "XTOOL_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          echo "$(cd "$(dirname "$BIN")" && pwd)" >> "$GITHUB_PATH"

      # Bounded on purpose: a probe with no terminal to talk to can wait for ever, and a
      # hang here is indistinguishable from a slow build.
      - name: Check the downloaded xtool runs
        id: xtool
        run: |
          "$XTOOL_BIN" --version > /tmp/xtool.out 2>&1 &
          pid=$!
          waited=0
          while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt 60 ]; do sleep 2; waited=$((waited + 2)); done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the released xtool binary did not answer --version within 60s"
          else
            cat /tmp/xtool.out
            echo "usable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the toolchain
        run: |
          swift --version
          xcodebuild -version

      # Only when the released binary did not answer. macos-26 ships a Swift new enough
      # for xtool's own package, which is all this build needs.
      - name: Build xtool from source
        if: steps.xtool.outputs.usable != 'true'
        run: |
          git clone --filter=blob:none https://github.com/xtool-org/xtool .xtool
          git -C .xtool checkout "$XTOOL_REF"
          swift build -c release --package-path .xtool
          echo "$PWD/.xtool/.build/release" >> "$GITHUB_PATH"

      # This build is written for Linux, where clang and the iPhoneOS SDK come from
      # xtool's Darwin bundle. macOS already has both in Xcode, and the script takes them
      # as overrides, so this points it at those rather than downloading the bundle.
      - name: Locate the iOS SDK
        id: sdk
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --find clang)
          test -d "$SDK" || { echo "::error::xcrun found no iPhoneOS SDK"; exit 1; }
          echo "path=$SDK" >> "$GITHUB_OUTPUT"
          echo "clang=$CLANG" >> "$GITHUB_OUTPUT"
          echo "SDK   $SDK"
          echo "clang $CLANG"

      # Cross-compiles madari-ios (and madari-tv/madari-native it depends on) to
      # aarch64-apple-ios and refreshes the Swift bindings the app compiles against.
      - name: Build the Rust core and bindings
        env:
          MADARI_IOS_SDK: ${{ steps.sdk.outputs.path }}
          MADARI_IOS_CLANG: ${{ steps.sdk.outputs.clang }}
        run: bash scripts/build-ios-native.sh

      # xtool assembles the bundle itself: its generated Xcode project compiles the Swift
      # to object files and leaves the .app to xtool's own packer, so `xcodebuild build`
      # exits successfully having produced Madari.o and no app at all. This is the same
      # command that builds the app locally.
      - name: Build the app
        working-directory: apps/ios
        run: xtool dev build

      - name: Package the ipa
        working-directory: apps/ios
        run: |
          # xtool's generated project does not put the bundle under DerivedData: it writes
          # it to xtool/, the same place `xtool dev build` does locally. Look there first,
          # then anywhere plausible, rather than assuming xcodebuild's usual layout.
          APP=""
          for candidate in xtool/Madari.app build/Build/Products/Release-iphoneos/Madari.app; do
            if [ -d "$candidate" ]; then APP="$candidate"; break; fi
          done
          if [ -z "$APP" ]; then
            APP=$(find . -maxdepth 5 -type d -name '*.app' -not -path './.build/*' | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "::error::no .app was produced"
            ls -la xtool 2>&1 | head -20 || true
            ls -la build/Build/Products/Release-iphoneos 2>&1 | head -20 || true
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App: $APP"

          # Every libmpv framework must be embedded, or the app builds fine and then
          # cannot decode Matroska on device.
          echo "Embedded frameworks:"
          ls "$APP/Frameworks" 2>&1 | head -25 || true
          MISSING=""
          for framework in Ass Avcodec Avfilter Avformat Avutil Dav1d Freetype Fribidi \
                           Harfbuzz Mbedcrypto Mbedtls Mbedx509 Mpv Png16 Swresample \
                           Swscale Uchardet Xml2; do
            test -d "$APP/Frameworks/$framework.framework" || MISSING="$MISSING $framework"
          done
          test -z "$MISSING" || { echo "::error::not embedded:$MISSING"; exit 1; }

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Madari-unsigned.ipa Payload
          unzip -l Madari-unsigned.ipa | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: madari-ios-ipa
          path: apps/ios/Madari-unsigned.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          cp apps/ios/Madari-unsigned.ipa "Madari-ios-${VERSION}-unsigned.ipa"
          gh release upload "$TAG" "Madari-ios-${VERSION}-unsigned.ipa" \
            --clobber --repo "$GITHUB_REPOSITORY"
