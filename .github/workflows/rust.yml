name: Rust

# The workspace covers every Rust surface: the shared crates, apps/server and
# apps/linux. apps/tv is Android and gets its own workflow.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # apps/linux links GTK4, libadwaita and libmpv, so the workspace will not
      # build anywhere without these.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev libmpv-dev

      # Pinned rather than `stable`: clippy gains lints between releases, and a
      # -D warnings gate must not turn red without a code change.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # madari-tv embeds the web UI with include_str!. build.rs writes honest
      # placeholders when web/dist is absent, so this job does not need the
      # Node build; the Web workflow covers the real assets.
      - name: Tests
        run: cargo test --workspace --locked
