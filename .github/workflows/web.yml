name: Web settings UI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/madari-tv/web

jobs:
  build:
    name: typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, so its `cache: pnpm` can find the pnpm store.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/madari-tv/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crates/madari-tv/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # tsc -b then vite build; the type check is part of the build script, so a
      # type error fails here rather than at runtime.
      - run: pnpm run build

      # The server embeds these three by fixed path. A stray hashed asset or lazy
      # chunk would be requested from a route that does not exist, so assert the
      # shape rather than only that the build exited zero.
      - name: Assert the embedded asset layout
        run: |
          for file in index.html app.js style.css; do
            test -f "dist/$file" || { echo "::error::dist/$file is missing"; exit 1; }
          done
          extra=$(find dist -type f ! -name index.html ! -name app.js ! -name style.css | wc -l)
          if [ "$extra" -ne 0 ]; then
            echo "::error::dist contains $extra unexpected file(s):"
            find dist -type f ! -name index.html ! -name app.js ! -name style.css
            exit 1
          fi

      # The generated client is committed, so a checkout with files missing from
      # git would still type-check locally and only fail for everyone else.
      - name: Assert the generated client is fully tracked
        working-directory: .
        run: |
          untracked=$(git status --porcelain --ignored crates/madari-tv/web/src \
            | grep -v '^!! .*node_modules' | grep -E '^\?\?|^!!' || true)
          if [ -n "$untracked" ]; then
            echo "::error::web/src contains files that are absent from or ignored by git:"
            echo "$untracked"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/madari-tv/web/dist
          retention-days: 7

  spec:
    name: openapi.json is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Only to run the package script; this job never installs dependencies.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/madari-tv/web/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      # Regenerates the document from the Rust DTOs. If it differs from the
      # committed file, the generated SDK is stale and so is the client.
      - run: pnpm run openapi

      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is out of date. Run 'pnpm run generate' in crates/madari-tv/web and commit the result."
            exit 1
          fi
